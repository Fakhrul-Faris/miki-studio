<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Miki">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.png">
<title>Miki Dashboard</title>
<link rel="stylesheet" href="/static/vendor/tabler.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">M</div><div>Miki<small>Meikigo · Explained</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><div><span class="dot"></span>Air online</div><div id="synced" class="mt-1"></div>
      <a href="#" id="theme-d" class="muted small d-inline-block mt-2">Light mode</a></div>
  </aside>
  <main class="main">
    <div class="topbar"><div class="brand"><div class="brand-mark">M</div><div id="tb-title">Today</div></div>
      <div class="d-flex gap-2"><a href="#settings" class="btn btn-soft btn-sm" aria-label="Settings">⚙︎</a></div></div>
    <div class="content">
      <section class="page" id="p-today"></section>
      <section class="page" id="p-calendar"></section>
      <section class="page" id="p-library"></section>
      <section class="page" id="p-analytics"></section>
      <section class="page" id="p-inbox"></section>
      <section class="page" id="p-settings"></section>
    </div>
  </main>
</div>
<nav class="tabbar" id="tabbar"></nav>

<!-- episode drawer -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="drawer"><div class="offcanvas-header"><h3 class="offcanvas-title" id="dr-title"></h3>
  <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body" id="dr-body"></div></div>

<!-- numbers modal -->
<div class="modal modal-blur fade" id="m-num" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="mn-title">Numbers</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <form id="mn-form"><div class="modal-body">
    <div id="mn-shot" class="mb-3"></div>
    <div class="row g-2">
      <div class="col-6"><label class="form-label">Post</label><select class="form-select" name="post_id" id="mn-post"></select></div>
      <div class="col-6"><label class="form-label">Checkpoint</label><select class="form-select" name="checkpoint"><option>24h</option><option>72h</option><option>7d</option></select></div>
      <div class="col-6"><label class="form-label">Views</label><input class="form-control" name="views" type="number" inputmode="numeric"></div>
      <div class="col-6"><label class="form-label">Avg watch (s)</label><input class="form-control" name="avg_watch" type="number" step="0.1" inputmode="decimal"></div>
      <div class="col-6"><label class="form-label">Watched full %</label><input class="form-control" name="full_pct" type="number" step="0.1" inputmode="decimal"></div>
      <div class="col-6"><label class="form-label">For You %</label><input class="form-control" name="fyp_pct" type="number" step="0.1" inputmode="decimal"></div>
      <div class="col-4"><label class="form-label">Likes</label><input class="form-control" name="likes" type="number" inputmode="numeric"></div>
      <div class="col-4"><label class="form-label">Comments</label><input class="form-control" name="comments" type="number" inputmode="numeric"></div>
      <div class="col-4"><label class="form-label">Shares</label><input class="form-control" name="shares" type="number" inputmode="numeric"></div>
      <div class="col-6"><label class="form-label">Saves</label><input class="form-control" name="saves" type="number" inputmode="numeric"></div>
      <div class="col-6"><label class="form-label">New follows</label><input class="form-control" name="follows" type="number" inputmode="numeric"></div>
    </div>
    <div class="small muted mt-2" id="mn-note"></div>
  </div><div class="modal-footer"><button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save numbers</button></div></form>
</div></div></div>

<!-- posted modal -->
<div class="modal modal-blur fade" id="m-post" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="mp-title">Posted</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <form id="mp-form"><div class="modal-body">
    <label class="form-label">Platform</label>
    <div class="btn-group w-100 mb-3" role="group" id="mp-plat"></div>
    <label class="form-label">When did it go live?</label>
    <input class="form-control" type="datetime-local" name="posted_at" required>
    <div class="d-flex gap-2 mt-2"><button type="button" class="btn btn-soft btn-sm" data-when="now">Just now</button><button type="button" class="btn btn-soft btn-sm" data-when="slot">At its slot</button></div>
    <label class="form-label mt-3">Link (optional)</label><input class="form-control" name="url" placeholder="https://www.tiktok.com/@…">
  </div><div class="modal-footer"><button class="btn btn-primary w-100">Mark posted</button></div></form>
</div></div></div>

<!-- scheduled modal -->
<div class="modal modal-blur fade" id="m-sched" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="ms-title">Scheduled in TikTok Studio</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <form id="ms-form"><div class="modal-body">
    <label class="form-label">The time you set in TikTok Studio</label>
    <input class="form-control" type="datetime-local" name="scheduled_at" required>
    <div class="d-flex gap-2 mt-2"><button type="button" class="btn btn-soft btn-sm" data-swhen="slot">Its slot</button><button type="button" class="btn btn-soft btn-sm" data-swhen="now">Now</button></div>
    <div class="small muted mt-3">TikTok publishes it by itself, so it counts as posted at this time and the 24 h · 72 h · 7 d stats clock starts from it.</div>
  </div><div class="modal-footer"><button class="btn btn-primary w-100">📅 Save as scheduled</button></div></form>
</div></div></div>

<input type="file" id="file" accept="image/*" hidden>
<div class="toast-box" id="toasts"></div>
<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/apexcharts.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
