  <script>
    (() => {

const tl = gsap.timeline({ paused: true });
CustomEase.create("io", "0.65,0,0.35,1");
CustomEase.create("fall", "0.55,0,1,0.45");
// critically damped spring (stiffness 170, damping 26, mass 1): arrives with weight, no bounce
const spring = (d = 0.8, w = 13.04) => { const e = 1 - (1 + w * d) * Math.exp(-w * d); return (p) => (1 - (1 + w * p * d) * Math.exp(-w * p * d)) / e; };
// organic camera: each layer drifts on two offset sines (7.3 s, 11.9 s); k = depth (0 far .. 1 near)
function drift(layers, dur, t0) {
  const o = { t: 0 }, P = Math.PI * 2;
  layers.forEach(([sel]) => gsap.set(sel, { transformOrigin: "50% 50%" }));
  tl.fromTo(o, { t: 0 }, { t: dur, duration: dur, ease: "none", onUpdate() {
    const s = o.t + t0;
    layers.forEach(([sel, k]) => gsap.set(sel, {
      x: k * (8 * Math.sin(P * s / 7.3) + 6 * Math.sin(P * s / 11.9 + 1.3)),
      y: k * (6 * Math.cos(P * s / 7.3 + 0.7) + 5 * Math.sin(P * s / 11.9)),
      rotation: k * 0.4 * Math.sin(P * s / 11.9 + 0.4) }));
  } }, 0);
}
// iris: opens to the Ring first (the contents swap inside it), then to the whole frame
function iris(sel, cx, cy, r) {
  tl.fromTo(sel, { clipPath: `circle(0px at ${cx}px ${cy}px)` }, { clipPath: `circle(${r}px at ${cx}px ${cy}px)`, duration: 0.35, ease: "io" }, 0)
    .fromTo(sel, { clipPath: `circle(${r}px at ${cx}px ${cy}px)` }, { clipPath: `circle(2300px at ${cx}px ${cy}px)`, duration: 0.5, ease: "io", immediateRender: false }, 0.45);
}
// kinetic type: a word rises out of its mask, tracking tightens +4% -> 0
function rise(sel, at, stagger = 0.1) {
  tl.fromTo(sel, { yPercent: 115, scaleX: 1.04 }, { yPercent: 0, scaleX: 1, duration: 0.5, ease: "io", stagger }, at);
}
function sink(sel, at, stagger = 0.06) {
  tl.fromTo(sel, { yPercent: 0 }, { yPercent: -115, duration: 0.45, ease: "io", stagger, immediateRender: false }, at);
}
// a key number counts, then settles 1.08 -> 1.00
function count(sel, a, b, at, d = 0.6, pre = "RM") {
  const o = { v: a }, el = document.querySelector(sel);
  tl.fromTo(o, { v: a }, { v: b, duration: d, ease: "io", immediateRender: false, onUpdate() { el.textContent = pre + Math.round(o.v); } }, at);
  tl.fromTo(sel, { scale: 1.08 }, { scale: 1, duration: 0.5, ease: "io", immediateRender: false }, at + d - 0.1);
}

      const T0 = 14.3;
      const Q = (s) => "#s3-w " + s;          // both copies (dark and lit) share the classes
      const at = (x) => +(x - T0).toFixed(3);    // film time → scene time

      tl.fromTo("#s3-clip .cone", { attr: { points: "530,0 550,0 550,1420 530,1420" } }, { attr: { points: "-200,0 1280,0 1280,1420 -200,1420" }, duration: 0.7, ease: "io", immediateRender: true }, 0.25);
      // the charger arrives from the left (it rolled out of the lorry), turning upright
      gsap.set(Q(".chg"), { x: -200, y: 1200, rotation: -40, svgOrigin: "0 0" });
      tl.to(Q(".chg"), { x: 540, y: 760, rotation: 0, scale: 1.6, duration: 0.9, ease: "io" }, 0.1);
      // "moved to the shelf": the pegboard fills (packs swing down onto their pegs); the charger shrinks into its own box
      document.querySelectorAll(Q(".pk")).forEach((el) => { const b = el.getBBox(); gsap.set(el, { svgOrigin: `${b.x + b.width / 2} ${b.y - 20}` }); });
      tl.fromTo(Q(".pk"), { rotation: -24, opacity: 0 }, { rotation: 0, opacity: 1, duration: 0.55, ease: spring(), stagger: 0.05 }, at(16.3 - 0.2));
      tl.to(Q(".chg"), { x: 520, y: 740, scale: 0.85, duration: 0.5, ease: "io" }, at(16.84 - 0.3));
      tl.to(Q(".cbox"), { opacity: 1, duration: 0.35, ease: "io" }, at(16.84 - 0.1));
      tl.to(Q(".chg"), { opacity: 0, duration: 0.2 }, at(16.84 + 0.2));
      // "here": the light narrows to a spotlight on the box (the dark copy takes the rest); "RM99": the tag swings in
      tl.fromTo("#s3-clip .cone", { attr: { points: "-200,0 1280,0 1280,1420 -200,1420" } }, { attr: { points: "470,0 610,0 900,1420 180,1420" }, duration: 0.8, ease: "io", immediateRender: false }, at(17.7 - 0.2));
      gsap.set(Q(".tag"), { svgOrigin: "600 640" });
      tl.fromTo(Q(".tag"), { opacity: 0, rotation: -70 }, { opacity: 1, rotation: 8, duration: 0.7, ease: spring(0.9, 9) }, at(18.3 - 0.15));
      tl.to(Q(".rm"), { opacity: 1, duration: 0.2 }, at(18.5));
      // hand-off: the spotlight closes to a thin vertical bar (the next scene's light opens from it)
      tl.to("#s3-clip .cone", { attr: { points: "530,0 550,0 550,1420 530,1420" }, duration: 0.45, ease: "io" }, at(19.62));
      tl.to("#s3-w .dark", { opacity: 0, duration: 0.4, ease: "io" }, at(19.65));   // only the bar of light crosses the cut

      window.__timelines["s3"] = tl;
    })();
