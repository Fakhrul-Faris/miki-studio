  <script>
    (() => {

const tl = gsap.timeline({ paused: true });
CustomEase.create("io", "0.65,0,0.35,1");
CustomEase.create("fall", "0.55,0,1,0.45");
// critically damped spring (stiffness 170, damping 26, mass 1): arrives with weight, no bounce
const spring = (d = 0.8, w = 13.04) => { const e = 1 - (1 + w * d) * Math.exp(-w * d); return (p) => (1 - (1 + w * p * d) * Math.exp(-w * p * d)) / e; };
// organic camera: each layer drifts on two offset sines (7.3 s, 11.9 s); k = depth (0 far .. 1 near)
function drift(layers, dur, t0) {
  const o = { t: 0 }, P = Math.PI * 2;
  layers.forEach(([sel]) => gsap.set(sel, { transformOrigin: "50% 50%" }));
  tl.fromTo(o, { t: 0 }, { t: dur, duration: dur, ease: "none", onUpdate() {
    const s = o.t + t0;
    layers.forEach(([sel, k]) => gsap.set(sel, {
      x: k * (8 * Math.sin(P * s / 7.3) + 6 * Math.sin(P * s / 11.9 + 1.3)),
      y: k * (6 * Math.cos(P * s / 7.3 + 0.7) + 5 * Math.sin(P * s / 11.9)),
      rotation: k * 0.4 * Math.sin(P * s / 11.9 + 0.4) }));
  } }, 0);
}
// iris: opens to the Ring first (the contents swap inside it), then to the whole frame
function iris(sel, cx, cy, r) {
  tl.fromTo(sel, { clipPath: `circle(0px at ${cx}px ${cy}px)` }, { clipPath: `circle(${r}px at ${cx}px ${cy}px)`, duration: 0.35, ease: "io" }, 0)
    .fromTo(sel, { clipPath: `circle(${r}px at ${cx}px ${cy}px)` }, { clipPath: `circle(2300px at ${cx}px ${cy}px)`, duration: 0.5, ease: "io", immediateRender: false }, 0.45);
}
// kinetic type: a word rises out of its mask, tracking tightens +4% -> 0
function rise(sel, at, stagger = 0.1) {
  tl.fromTo(sel, { yPercent: 115, scaleX: 1.04 }, { yPercent: 0, scaleX: 1, duration: 0.5, ease: "io", stagger }, at);
}
function sink(sel, at, stagger = 0.06) {
  tl.fromTo(sel, { yPercent: 0 }, { yPercent: -115, duration: 0.45, ease: "io", stagger, immediateRender: false }, at);
}
// a key number counts, then settles 1.08 -> 1.00
function count(sel, a, b, at, d = 0.6, pre = "RM") {
  const o = { v: a }, el = document.querySelector(sel);
  tl.fromTo(o, { v: a }, { v: b, duration: d, ease: "io", immediateRender: false, onUpdate() { el.textContent = pre + Math.round(o.v); } }, at);
  tl.fromTo(sel, { scale: 1.08 }, { scale: 1, duration: 0.5, ease: "io", immediateRender: false }, at + d - 0.1);
}

      const T0 = 6.55;
      const Q = (s) => "#s2-w " + s;          // both copies (dark and lit) share the classes
      const at = (x) => +(x - T0).toFixed(3);    // film time → scene time

      const cam = (s, px, py) => ({ scale: s, x: 540 - s * px, y: 960 - s * py });
      gsap.set(Q(".cam"), { svgOrigin: "0 0", ...cam(6.2, 328.0, 986 + 34) });
      gsap.set(Q(".hero"), { svgOrigin: "252 1032" });
      gsap.set(Q(".chg"), { svgOrigin: "0 0", x: 378, y: 982, scale: 0.17 });
      tl.fromTo("#s2-clip polygon", { x: -1500 }, { x: -60, duration: 0.8, ease: "io" }, 0.15).to("#s2-clip polygon", { x: 60, duration: 7, ease: "none" }, 0.95);
      // the cut lands on navy (S1's recess); the box rises into view
      tl.fromTo(Q(".hero, .yr"), { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: spring() }, 0.08);
      tl.fromTo(Q(".chg"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.18);
      // "without the charger": it lifts out of the box and up
      tl.to(Q(".chg"), { y: 920, x: 384, duration: 0.6, ease: "io" }, at(7.05 - 0.1));
      // as the camera pulls back the charger rises clear of the stack and keeps its size on screen
      tl.to(Q(".chg"), { x: 470, y: 640, scale: 0.55, duration: 1.2, ease: "io" }, at(8.89 - 0.45));
      tl.to(Q(".chg"), { x: 600, y: 622, scale: 1.15, duration: 1.3, ease: "io" }, at(11.81 - 0.3));   // riding on the lorry roof
      // "the box got thin": the old box presses down to the thin box; a ghost keeps the old height; 2019 → 2020
      tl.to(Q(".ghost"), { opacity: 1, duration: 0.2 }, at(7.61 - 0.05));
      tl.to(Q(".hero"), { scaleY: 42 / 72, duration: 0.45, ease: "power2.in" }, at(7.83 - 0.1));
      tl.to(Q(".y19"), { opacity: 0, duration: 0.15 }, at(8.05)).to(Q(".y20"), { opacity: 1, duration: 0.2 }, at(8.05 + 0.1));
      // "70% more boxes … every pallet": pull back to the pallet; the stack fills row by row; the label counts
      tl.to(Q(".cam"), { ...cam(2.35, 328, 1080), duration: 1.2, ease: "io" }, at(8.89 - 0.45));
      tl.to(Q(".ghost, .yr"), { opacity: 0, duration: 0.3 }, at(8.89 + 0.25));
      tl.fromTo(Q(".bx1"), { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "fall", stagger: (i, el) => +el.dataset.r * 0.08 }, at(8.89 - 0.2));
      tl.to(Q(".old"), { opacity: 1, duration: 0.3 }, at(8.89 - 0.3));
      tl.to(Q(".lab"), { opacity: 1, duration: 0.3 }, at(8.89 - 0.1));
