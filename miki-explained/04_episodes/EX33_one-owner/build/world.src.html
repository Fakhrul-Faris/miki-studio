<!doctype html>
<!--
  EX33 "One Owner" — the whole film is one continuous Three.js world, drawn flat (Style B upgraded, 2026-11-10).
  Every value comes from the clock t (render(t)), so a render equals a seek. Built by build/hf_ex33.py:
  /*TIMES*/ is replaced with the voice's word times (audio/vo_timeline.json), /*MAP*/ with Malaysia's outline
  (Natural Earth 1:50m via world-atlas, build/malaysia.json).
  Look: two-tone toon shading (one light tone, one cool shadow tone per surface), no outlines, a low hard sun whose
  shadows carry the idea, one accent: the red strings (the owner's control) — everything hangs from one bar.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #E6D6BC; }
      #w-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #E6D6BC; }
      #w-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
    </style>
  </head>
  <body>
    <div id="w-root" data-composition-id="world" data-start="0" data-duration="/*END*/" data-width="1080" data-height="1920">
      <canvas id="w-canvas" class="clip" data-start="0" data-duration="/*END*/" data-track-index="1"></canvas>
    </div>
    <script>
      (function () {
        var root = document.getElementById("w-root");
        var duration = /*END*/;   // not read from the root: inside the film the root's data-duration is not there (NaN blanked every surface)
        var clock = { t: 0 };
        var host = { duration: duration, clock: clock, render: null };
        window.__ex33 = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["world"] = new Promise(function (resolve) { host.ready = resolve; });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: duration, duration: duration, ease: "none", onUpdate: function () { if (host.render) host.render(clock.t); } });
        window.__timelines = window.__timelines || {};
        window.__timelines["world"] = tl;
      })();
    </script>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";
      const host = window.__ex33;
      const WT = /*TIMES*/;
      const MAP = /*MAP*/;
      const END = host.duration;
      const at = (L, frag, n = 0) => WT[L].filter((x) => x[0].toLowerCase().includes(frag.toLowerCase()))[n][1];

      // ---------- easing (no bounce: arrive with weight)
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const k = (t, a, b) => clamp((t - a) / (b - a));
      const io = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
      const out3 = (u) => 1 - Math.pow(1 - u, 3);
      const spring = (u, w = 9) => { const e = 1 - (1 + w) * Math.exp(-w); return clamp((1 - (1 + w * u) * Math.exp(-w * u)) / e); };
      const lerp = (a, b, u) => a + (b - a) * u;
      // a hanging thing's sway: damped pendulum after it arrives (angle in rad)
      const sway = (t, t0, amp = 0.12, per = 1.7, damp = 1.1) => (t < t0 ? 0 : amp * Math.exp(-(t - t0) * damp) * Math.sin((2 * Math.PI * (t - t0)) / per));
      const P2 = Math.PI * 2;

      // ---------- palette: warm light, cool shadow, one accent
      const C = {
        floor: "#E6D6BC", land: "#F4ECDF", wood: "#B9844F", woodDark: "#8F5F34", card: "#FBF7F0",
        black: "#1C1C21", white: "#F2EFEA", string: "#D7262E", lensRB: "#263A2C", lensOak: "#C8452E",
        kiosk: "#F1E9DC", kioskBand: "#2B2B30", essilor: "#BFE0E6", grey: "#8A8C93", tort: "#6B4128", shop: "#FBF5EA", awning: "#D7262E",
      };

      // ---------- renderer
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("w-canvas"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1080, 1920, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(C.floor);
      scene.fog = new THREE.Fog(C.floor, 26, 60);   // the floor melts into the backdrop: no horizon line
      const camera = new THREE.PerspectiveCamera(42, 1080 / 1920, 0.05, 200);

      // two-tone toon ramp: below the step = shadow tone (hemisphere only), above = full sun
      const ramp = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255, ...Array(7).fill([255, 255, 255, 255]).flat()]), 8, 1, THREE.RGBAFormat);
      ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
      const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: ramp, ...extra });
      const hemi = new THREE.HemisphereLight("#C2BEDC", "#C2BEDC", 2.6);   // the cool shadow tone (measured: shadow = albedo × ~(.55,.52,.72))
      scene.add(hemi);
      const sun = new THREE.DirectionalLight("#FFF6C4", 1.54);   // hemi + sun ≈ 1.0: a lit surface shows its own colour
      sun.castShadow = true;
      sun.shadow.mapSize.set(4096, 4096);
      sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
      scene.add(sun, sun.target);

      // ---------- floor (the sea and, later, the map's ground)
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), toon(C.floor, { polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

      // ---------- textures (logos rasterised once; official files, 02_kit/brand/logos)
      const img = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
      const canvasTex = (w, h, draw) => { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); draw(g, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
      const fit = (g, im, x, y, w, h) => { const s = Math.min(w / im.width, h / im.height); const dw = im.width * s, dh = im.height * s; g.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); };
      try { for (const [wt, n] of [[500, "Medium"], [700, "Bold"], [900, "Black"]]) document.fonts.add(await new FontFace("Inter Display", `url(assets/fonts/InterDisplay-${n}.ttf)`, { weight: String(wt) }).load()); } catch (e) { console.error("[ex33] font", e); }
      const L = {};
      for (const n of ["rayban.svg", "oakley.svg", "essilorluxottica.svg", "prada.svg", "chanel.svg", "armani.svg", "alook.png", "sunglasshut.jpg"]) L[n.split(".")[0]] = await img(`assets/logos/${n}`);
      // the Ray-Ban script alone (the white letters of its own badge), as printed on a Wayfarer's lens
      const rbScript = canvasTex(1024, 552, (g, w, h) => {
        g.drawImage(L.rayban, 0, 0, w, h); const d = g.getImageData(0, 0, w, h), p = d.data;
        for (let i = 0; i < p.length; i += 4) { const m = Math.min(p[i], p[i + 1], p[i + 2]); p[i + 3] = m > 200 ? 255 : m > 150 ? (m - 150) * 5 : 0; p[i] = p[i + 1] = p[i + 2] = 246; }
        g.putImageData(d, 0, 0);
      });
      const rbBadge = canvasTex(1024, 552, (g, w, h) => g.drawImage(L.rayban, 0, 0, w, h));
      // Oakley's ellipse icon (the top of its own lockup), white, for the temple
      const oakIcon = canvasTex(1024, 512, (g, w, h) => {
        const sh = L.oakley.height * (1024 / L.oakley.width); g.drawImage(L.oakley, 0, 0, 1024, sh);
        const d = g.getImageData(0, 0, w, h), p = d.data;
        for (let i = 0; i < p.length; i += 4) { const a = p[i + 3] * (1 - Math.min(p[i], p[i + 1], p[i + 2]) / 255); p[i] = p[i + 1] = p[i + 2] = 30; p[i + 3] = a; }
        g.putImageData(d, 0, 0);
      });
      const oakLockup = canvasTex(640, 900, (g, w, h) => { g.fillStyle = C.card; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(0,0,0,0.12)"; g.beginPath(); g.arc(w / 2, 90, 34, 0, P2); g.fill(); fit(g, L.oakley, 70, 250, w - 140, 300); });
      const card = (logo, sub, tone = C.card, ink = "#1C1C21") => canvasTex(640, 900, (g, w, h) => {
        g.fillStyle = tone; g.fillRect(0, 0, w, h);
        g.fillStyle = "rgba(0,0,0,0.12)"; g.beginPath(); g.arc(w / 2, 90, 34, 0, P2); g.fill();     // the tag's hole
        fit(g, logo, 70, 230, w - 140, 300);
        if (sub) { g.fillStyle = ink; g.font = '700 54px "Inter Display"'; g.textAlign = "center"; g.fillText(sub, w / 2, 700); }
      });
      const elPlate = canvasTex(2048, 300, (g, w, h) => { g.fillStyle = C.card; g.fillRect(0, 0, w, h); fit(g, L.essilorluxottica, 110, 70, w - 220, h - 140); });
      const shSign = canvasTex(1375, 343, (g, w, h) => g.drawImage(L.sunglasshut, 0, 0, w, h));
      const revenue = canvasTex(900, 1200, (g, w, h) => {
        g.fillStyle = C.card; g.fillRect(0, 0, w, h);
        g.fillStyle = "rgba(0,0,0,0.12)"; g.beginPath(); g.arc(w / 2, 110, 44, 0, P2); g.fill();
        g.fillStyle = "#1C1C21"; g.textAlign = "center";
        g.font = '900 236px "Inter Display"'; g.fillText("€28.5", w / 2, 560);
        g.font = '900 150px "Inter Display"'; g.fillText("billion", w / 2, 730);
        g.fillStyle = C.string; g.fillRect(140, 820, w - 280, 10);
        g.fillStyle = "#1C1C21"; g.font = '700 70px "Inter Display"'; g.fillText("revenue · 2025", w / 2, 950);
      });
      const tagBack = canvasTex(900, 1200, (g, w, h) => {
        g.fillStyle = C.card; g.fillRect(0, 0, w, h);
        g.fillStyle = "rgba(0,0,0,0.12)"; g.beginPath(); g.arc(w / 2, 110, 44, 0, P2); g.fill();
        fit(g, L.essilorluxottica, 90, 480, w - 180, 220);
      });
      const essilorTag = canvasTex(1024, 300, (g, w, h) => { g.fillStyle = C.card; g.fillRect(0, 0, w, h); g.fillStyle = "#16365E"; g.font = '900 170px "Inter Display"'; g.textAlign = "center"; g.fillText("ESSILOR", w / 2, 212); });
      const signTex = (txt) => canvasTex(800, 240, (g, w, h) => { g.fillStyle = "#1C1C21"; g.fillRect(0, 0, w, h); g.fillStyle = C.white; g.font = '900 150px "Inter Display"'; g.textAlign = "center"; g.fillText(txt, w / 2, 172); });
      const aLookSign = canvasTex(1000, 240, (g, w, h) => { g.fillStyle = C.white; g.fillRect(0, 0, w, h); fit(g, L.alook, 60, 30, w - 120, h - 60); });
      // the kiosk's window: shelves of frames, drawn flat
      const shelves = canvasTex(1024, 768, (g, w, h) => {
        g.fillStyle = "#2E3A44"; g.fillRect(0, 0, w, h);
        for (let r = 0; r < 3; r++) {
          const y = 150 + r * 230; g.fillStyle = "#C9B79C"; g.fillRect(40, y + 60, w - 80, 16);
          for (let c = 0; c < 5; c++) {
            const x = 110 + c * 190; g.fillStyle = ["#1C1C21", C.lensOak, "#6B4128", "#1C1C21", "#8A8C93"][(c + r) % 5];
            g.beginPath(); g.ellipse(x - 34, y + 22, 34, 24, 0, 0, P2); g.ellipse(x + 34, y + 22, 34, 24, 0, 0, P2); g.fill(); g.fillRect(x - 10, y + 10, 20, 7);
          }
        }
        g.fillStyle = "rgba(255,255,255,0.10)"; g.beginPath(); g.moveTo(w * 0.55, 0); g.lineTo(w * 0.75, 0); g.lineTo(w * 0.35, h); g.lineTo(w * 0.15, h); g.fill();
      });

      // ---------- geometry helpers
      const chaikin = (pts, n = 3) => { let p = pts; for (let i = 0; i < n; i++) { const q = []; for (let j = 0; j < p.length; j++) { const a = p[j], b = p[(j + 1) % p.length]; q.push([0.75 * a[0] + 0.25 * b[0], 0.75 * a[1] + 0.25 * b[1]], [0.25 * a[0] + 0.75 * b[0], 0.25 * a[1] + 0.75 * b[1]]); } p = q; } return p; };
      const mirror = (half) => [...half, ...half.slice().reverse().map(([x, y]) => [-x, y])];
      const shapeOf = (pts) => new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
      const pathOf = (pts) => new THREE.Path(pts.map(([x, y]) => new THREE.Vector2(x, y)));
      const flipX = (pts) => pts.map(([x, y]) => [-x, y]).reverse();
      const shadowy = (o) => { o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
      const plane = (w, h, map, two = false) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map, transparent: true, side: two ? THREE.DoubleSide : THREE.FrontSide, toneMapped: false }));
      // wrap round a vertical cylinder whose axis is R behind the front: the ends sweep back
      const bend = (geo, R) => { const p = geo.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i), a = x / R; p.setX(i, (R + z) * Math.sin(a)); p.setZ(i, (R + z) * Math.cos(a) - R); } p.needsUpdate = true; geo.computeVertexNormals(); return geo; };
      // a decal on a temple's outer face (R: the +x temple, whose outer face is its local -z)
      const templeDecal = (tm, tex, w, h, isR, at = -0.3) => { const d = plane(w, h, tex); d.position.set(at, 0, isR ? -0.002 : 0.037); if (isR) d.rotation.y = Math.PI; tm.add(d); return d; };

      // a pair of glasses: front (with lens holes) + lenses + temples; facing +z, bridge top at the origin's +y
      function glasses({ outer, hole, frame, lens, depth = 0.07, wrap = 0, templeLen = 1.05, hingeX, hingeY = 0.12 }) {
        const g = new THREE.Group();
        const holeR = chaikin(hole), holeL = flipX(holeR);
        const s = shapeOf(chaikin(mirror(outer)));
        s.holes.push(pathOf(holeR), pathOf(holeL));
        let fg = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelSize: 0.012, bevelThickness: 0.012, bevelSegments: 2, curveSegments: 6 });
        fg.translate(0, 0, -depth / 2);
        if (wrap) fg = bend(fg, wrap);
        const front = new THREE.Mesh(fg, toon(frame)); g.add(front);
        for (const hp of [holeR, holeL]) {
          let lg = new THREE.ShapeGeometry(shapeOf(hp)); if (wrap) lg = bend(lg, wrap);
          const m = new THREE.Mesh(lg, toon(lens, { side: THREE.DoubleSide })); g.add(m);
        }
        for (const sx of [1, -1]) {   // temples: a bar running back with the earpiece bend
          const tp = new THREE.Shape(chaikin([[0.02, 0.05], [-templeLen * 0.82, 0.03], [-templeLen, -0.16], [-templeLen - 0.03, -0.12], [-templeLen * 0.84, -0.02], [0.02, -0.05]], 2).map(([x, y]) => new THREE.Vector2(x, y)));
          const tg = new THREE.ExtrudeGeometry(tp, { depth: 0.035, bevelEnabled: false });
          const tm = new THREE.Mesh(tg, toon(frame));
          const hx = wrap ? wrap * Math.sin(hingeX / wrap) : hingeX, hz = wrap ? wrap - wrap * Math.cos(hingeX / wrap) : 0;
          tm.rotation.y = -Math.PI / 2 - sx * 0.05;            // local +x runs back (-z); splayed out a touch
          tm.position.set(sx > 0 ? hx : -hx + 0.035, hingeY, -hz);
          g.add(tm); if (sx > 0) g.userData.templeR = tm; else g.userData.templeL = tm;
        }
        return shadowy(g);
      }
      // Ray-Ban Wayfarer: trapezoid lenses, a heavy brow, the two rivets at the hinge wings
      const WAYF = { outer: [[0, 0.245], [0.74, 0.255], [0.79, 0.2], [0.75, 0.1], [0.67, -0.2], [0.56, -0.255], [0.21, -0.255], [0.13, -0.18], [0.1, 0.03], [0, 0.07]],
                     hole: [[0.155, 0.165], [0.665, 0.17], [0.6, -0.165], [0.53, -0.2], [0.23, -0.2], [0.17, -0.13]] };
      function wayfarer() {
        const g = glasses({ ...WAYF, frame: C.black, lens: C.lensRB, hingeX: 0.765, hingeY: 0.16 });
        for (const sx of [1, -1]) {   // rivets
          for (const dx of [0, 0.07]) { const r = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.01, 16), toon("#D8D8D8")); r.rotation.x = Math.PI / 2; r.position.set(sx * (0.62 + dx), 0.2, 0.05); g.add(r); }
        }
        const logo = plane(0.2, 0.108, rbScript); logo.position.set(-0.47, 0.11, 0.006); g.add(logo);   // the wearer's right lens, top corner
        templeDecal(g.userData.templeL, rbBadge, 0.17, 0.092, false); templeDecal(g.userData.templeR, rbBadge, 0.17, 0.092, true);
        return g;
      }
      // Oakley wrap: one shield lens across, a half rim on top, the ellipse on the temples
      const SHIELD = [[0, 0.17], [0.3, 0.205], [0.6, 0.17], [0.72, 0.08], [0.7, -0.07], [0.6, -0.2], [0.4, -0.25], [0.21, -0.215], [0.11, -0.1], [0.06, -0.02], [0, -0.005]];
      function oakley() {
        const g = new THREE.Group();
        let lg = new THREE.ExtrudeGeometry(shapeOf(chaikin(mirror(SHIELD))), { depth: 0.012, bevelEnabled: false, curveSegments: 6 });
        lg = bend(lg, 0.95); g.add(new THREE.Mesh(lg, toon(C.lensOak)));
        const rim = [[0, 0.215], [0.3, 0.255], [0.62, 0.22], [0.76, 0.12], [0.73, 0.07], [0.6, 0.15], [0.3, 0.18], [0, 0.15]];
        let rg = new THREE.ExtrudeGeometry(shapeOf(chaikin(mirror(rim))), { depth: 0.06, bevelEnabled: true, bevelSize: 0.01, bevelThickness: 0.01, bevelSegments: 2 });
        rg.translate(0, 0, -0.04); rg = bend(rg, 0.95); g.add(new THREE.Mesh(rg, toon(C.white)));
        const tmp = glasses({ outer: [[0, 0.01], [0.01, 0.01], [0.01, 0], [0, 0]], hole: [[0.002, 0.004], [0.004, 0.004], [0.004, 0.002], [0.002, 0.002]], frame: C.white, lens: C.white, hingeX: 0.74, hingeY: 0.12, wrap: 0.95, templeLen: 1.0 });
        for (const tm of [tmp.userData.templeR, tmp.userData.templeL]) { g.add(tm); templeDecal(tm, oakIcon, 0.2, 0.1, tm === tmp.userData.templeR, -0.25); }
        return shadowy(g);
      }

      // ---------- the owner: a marionette control bar (wood), EssilorLuxottica's plate on its face
      const bar = new THREE.Group(); scene.add(bar);
      const woodM = toon(C.wood);
      const mainBar = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.16, 0.16), woodM); bar.add(mainBar);
      const crossBar = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 1.9), woodM); crossBar.position.y = 0.16; bar.add(crossBar);
      for (const sx of [-1, 1]) { const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.2, 20), toon(C.woodDark)); cap.rotation.z = Math.PI / 2; cap.position.x = sx * 2.0; bar.add(cap); }
      const hook = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.035, 10, 32), toon(C.woodDark)); hook.position.y = 0.42; bar.add(hook);
      const plate = plane(2.6, 0.38, elPlate); plate.position.set(0, -0.02, 0.083); bar.add(plate);
      const plateBack = plane(2.6, 0.38, elPlate); plateBack.position.set(0, -0.02, -0.083); plateBack.rotation.y = Math.PI; bar.add(plateBack);
      shadowy(bar);
      const BAR_Y = 6.4;

      // ---------- the hanging things
      const rb = wayfarer(); scene.add(rb);
      const oak = oakley(); scene.add(oak);
      const rivalTag = (g, tex, x) => { const tg = new THREE.Group(); const m = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.64), new THREE.MeshToonMaterial({ map: tex, gradientMap: ramp, side: THREE.DoubleSide })); m.position.y = -0.4; m.castShadow = true; tg.add(m); tg.position.set(x, 0.12, 0.06); g.add(tg); return tg; };
      const rbTag = rivalTag(rb, card(L.rayban, ""), -0.78), oakTag = rivalTag(oak, oakLockup, 0.74);
      const kiosk = new THREE.Group(); scene.add(kiosk);
      {
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.95, 0.75), toon(C.kiosk)); body.position.y = -0.95; kiosk.add(body);
        const win = plane(1.05, 0.62, shelves); win.position.set(0, -0.98, 0.378); kiosk.add(win);
        const band = new THREE.Mesh(new THREE.BoxGeometry(1.31, 0.1, 0.81), toon(C.kioskBand)); band.position.y = -0.44; kiosk.add(band);
        const sign = new THREE.Mesh(new THREE.BoxGeometry(1.31, 0.33, 0.81), toon(C.white)); sign.position.y = -0.22; kiosk.add(sign);
        const sp = plane(1.24, 0.31, shSign); sp.position.set(0, -0.22, 0.408); kiosk.add(sp);
        const base = new THREE.Mesh(new THREE.BoxGeometry(1.31, 0.08, 0.81), toon(C.kioskBand)); base.position.y = -1.46; kiosk.add(base);
        shadowy(kiosk);
      }
      const lens = new THREE.Group(); scene.add(lens);
      {
        const prof = []; for (let i = 0; i <= 24; i++) { const r = (i / 24) * 0.62; prof.push(new THREE.Vector2(r, 0.07 - 0.11 * (r / 0.62) ** 2)); }
        for (let i = 24; i >= 0; i--) { const r = (i / 24) * 0.62; prof.push(new THREE.Vector2(r, -0.02 - 0.07 * (r / 0.62) ** 2)); }
        const disc = new THREE.Mesh(new THREE.LatheGeometry(prof, 64), toon(C.essilor)); disc.rotation.x = Math.PI / 2; disc.position.y = -0.64; lens.add(disc);
        const st = plane(0.72, 0.21, essilorTag); st.position.set(0, -0.64, 0.075); lens.add(st);
        shadowy(lens);

            for (const [n, o, bx] of boxes) { if (o === owner) continue; seg.set(a, b); for (let q = 0.02; q < 0.98; q += 0.02) { seg.at(q, p); if (bx.containsPoint(p)) { (bad[n + " × string of " + things.find((x) => x[1] === owner)[0]] ||= []).push(+t.toFixed(2)); break; } } }
          }
          // thing vs thing: only when their overall boxes meet, then part by part (each mesh's own box)
          const parts = (o) => { const r = []; o.traverse((m) => { if (m.isMesh && m.visible) r.push(new THREE.Box3().setFromObject(m).expandByScalar(-0.005)); }); return r; };
          for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
            if (!boxes[i][2].intersectsBox(boxes[j][2])) continue;
            const pa = parts(boxes[i][1]), pb = parts(boxes[j][1]);
            if (pa.some((x) => pb.some((y) => x.intersectsBox(y)))) (bad[boxes[i][0] + " × " + boxes[j][0]] ||= []).push(+t.toFixed(2));
          }
          // shop strings vs the hanging things
          const M = new THREE.Matrix4();
          for (let i = 0; i < NS; i++) { shopStr.getMatrixAt(i, M); const a = new THREE.Vector3().setFromMatrixPosition(M); const b = new THREE.Vector3(0, 1, 0).applyMatrix4(M); if (a.distanceTo(b) < 0.05) continue; seg.set(a, b); for (const [n, , bx] of boxes) for (let q = 0.02; q < 0.98; q += 0.02) { seg.at(q, p); if (bx.containsPoint(p)) { (bad[n + " × shop string"] ||= []).push(+t.toFixed(2)); break; } } }
        }
        host.render(host.clock.t);
        return Object.fromEntries(Object.entries(bad).map(([n, ts]) => [n, `${ts.length} frames, ${ts[0]}–${ts[ts.length - 1]} s`]));
      };

      host.render(host.clock.t);
      host.ready();
    </script>
  </body>
</html>
