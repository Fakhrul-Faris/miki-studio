<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- EX27 F3 "the raise": hand-drawn vector. media/F3.png is the drawing guide only (layout, scale, light); nothing traced.
       Light from the upper right: lilac = lit faces, navy = the shadow side and rims, deep lilac = turned-away planes. -->
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="27"/><feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer></filter>
  </defs>

  <rect width="1080" height="1920" fill="#E8692A"/>

  <!-- floor shadows, cast to the lower right -->
  <g id="F3-shadow" fill="#1B2A4E">
    <path d="M640 1584 L1080 1540 L1080 1650 L690 1606 Z"/>
    <path d="M96 1584 L690 1562 L700 1578 L120 1600 Z" opacity=".9"/>
  </g>

  <!-- the shopper: tiny, stepping back, head tipped up (holds the pose) -->
  <g id="F3-person" fill="#1B2A4E">
    <path d="M766 1814 L1080 1838 L1080 1852 L774 1824 Z" opacity=".85"/>
    <circle cx="806" cy="1660" r="15"/>
    <path d="M792 1676 Q812 1670 820 1684 L830 1750 L786 1758 L784 1712 Z"/>
    <path d="M790 1752 L806 1754 L788 1790 L772 1818 L756 1816 L774 1786 Z"/>
    <path d="M812 1752 L828 1750 L836 1784 L852 1810 L838 1816 L820 1788 Z"/>
    <path d="M790 1686 L800 1690 L782 1728 L770 1742 L764 1736 L774 1720 Z"/>
    <path d="M816 1686 L826 1684 L842 1716 L846 1738 L838 1740 L832 1720 Z"/>
  </g>

  <!-- lower block: the extra RM100 the seller slides in -->
  <g id="F3-lowblock">
    <path d="M112 1350 L650 1328 L680 1334 L104 1362 Z" fill="#FCF4E7"/>
    <path d="M104 1362 L680 1334 L690 1562 L96 1584 Z" fill="#F2E5CF"/>
    <path d="M104 1362 L130 1361 L122 1583 L96 1584 Z" fill="#E4D4BB"/>
  </g>

  <!-- upper block + vacuum rise together -->
  <g id="F3-riser">
    <path d="M120 1044 L646 1026 L650 1322 L112 1344 Z" fill="#F2E5CF"/>
    <path d="M126 1032 L640 1014 L646 1026 L120 1044 Z" fill="#FCF4E7"/>
    <path d="M120 1044 L146 1043 L138 1343 L112 1344 Z" fill="#E4D4BB"/>
    <path d="M112 1344 L650 1322 L652 1336 L114 1358 Z" fill="#B9A487"/>

    <g id="F3-vacuum">
      <!-- hose: a ribbed navy tube that hooks over into the spine -->
      <path d="M232 806 L232 258 Q232 196 292 192" fill="none" stroke="#1B2A4E" stroke-width="66" stroke-linecap="round"/>
      <g fill="none" stroke="#A89BF4" stroke-width="7" stroke-linecap="round">
        <path d="M204 224 Q218 212 246 206 M202 246 Q220 236 248 232 M202 268 Q220 258 248 254 M202 290 Q220 280 248 276 M202 312 Q220 302 248 298
                 M202 334 Q220 324 248 320 M202 356 Q220 346 248 342 M202 378 Q220 368 248 364 M202 400 Q220 390 248 386 M202 422 Q220 412 248 408
                 M202 444 Q220 434 248 430 M202 466 Q220 456 248 452 M202 488 Q220 478 248 474 M202 510 Q220 500 248 496 M202 532 Q220 522 248 518
                 M202 554 Q220 544 248 540 M202 576 Q220 566 248 562 M202 598 Q220 588 248 584 M202 620 Q220 610 248 606 M202 642 Q220 632 248 628
                 M202 664 Q220 654 248 650 M202 686 Q220 676 248 672 M202 708 Q220 698 248 694 M202 730 Q220 720 248 716 M202 752 Q220 742 248 738
                 M202 774 Q220 764 248 760"/>
      </g>
      <path d="M216 792 L330 792 L330 866 L232 866 Q216 866 216 850 Z" fill="#1B2A4E"/>

      <path d="M258 330 L296 330 L296 800 L258 800 Z" fill="#1B2A4E"/>
      <!-- spine: one navy column from the grip to the foot -->
      <path d="M282 64 Q282 26 308 26 Q334 26 336 64 L340 300 L334 884 L290 884 L290 300 Z" fill="#1B2A4E"/>
      <!-- grip + upper handle, lit on the right -->
      <path d="M318 34 Q340 30 350 58 L360 168 L330 170 L322 64 Z" fill="#A89BF4"/>
      <path d="M322 168 Q344 160 362 176" fill="none" stroke="#1B2A4E" stroke-width="7" stroke-linecap="round"/>
      <path d="M330 180 L366 180 L380 292 L334 296 Z" fill="#A89BF4"/>
      <path d="M366 180 L374 180 L390 292 L380 292 Z" fill="#1B2A4E"/>

      <!-- body: rounded shoulder, widening to the foot -->
      <path d="M292 336 Q296 294 342 292 L418 294 Q452 298 460 342 L480 824 L300 834 Z" fill="#1B2A4E"/>
      <path d="M332 300 L414 302 Q434 308 438 342 L456 806 L334 814 Z" fill="#A89BF4"/>
      <path d="M326 316 L326 808 Q328 830 352 832 L464 842" fill="none" stroke="#A89BF4" stroke-width="8" stroke-linecap="round"/>
      <path d="M326 808 Q330 830 352 832" fill="none" stroke="#1B2A4E" stroke-width="3"/>

      <!-- neck with its seam -->
      <path d="M228 846 L470 852 L474 902 L228 904 Z" fill="#1B2A4E"/>
      <path d="M346 846 L346 900" stroke="#A89BF4" stroke-width="6" stroke-linecap="round"/>

      <!-- head: the nozzle roll slopes down to the front -->
      <path d="M175 940 Q180 884 240 882 L382 886 L444 906 Q526 932 600 974 Q620 990 616 1014 L610 1028 L222 1024 Q178 1012 175 960 Z" fill="#1B2A4E"/>
      <path d="M252 890 L372 892 L396 914 L292 918 Z" fill="#A89BF4"/>
      <path d="M296 924 L468 930 Q556 952 596 984 L594 996 Q520 966 440 954 L300 948 Z" fill="#A89BF4"/>
      <path d="M302 972 L446 980 Q530 994 590 1010" fill="none" stroke="#A89BF4" stroke-width="10" stroke-linecap="round"/>
      <!-- wheel, seen three-quarter -->
      <ellipse cx="208" cy="958" rx="48" ry="64" fill="#1B2A4E"/>
      <ellipse cx="214" cy="956" rx="26" ry="46" fill="#A89BF4"/>
      <path d="M262 906 Q292 940 288 1000" fill="none" stroke="#A89BF4" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- the giant hand: sleeve, cuff, and a hand that grips the lower block (thumb on its face, fingers under it) -->
  <g id="F3-hand">
    <path d="M1080 688 L812 1084 L790 1112 L950 1270 Q980 1300 1040 1304 L1080 1296 Z" fill="#1B2A4E"/>
    <path d="M790 1130 L950 1270 C930 1316 896 1376 874 1430 C852 1486 816 1530 756 1560 C728 1576 700 1590 640 1596 L560 1598
