    <path d="M748 1300 C742 1380 736 1450 726 1538 M700 1262 C690 1282 686 1302 690 1322" fill="none" stroke="#7466D4" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="602" cy="1364" rx="26" ry="17" fill="#C9C0FA" transform="rotate(-24 602 1364)"/>
    <path d="M812 1092 L980 1222 L952 1270 L790 1130 Z" fill="#F6EAD7"/>
    <path d="M980 1222 L988 1232 L960 1280 L952 1270 Z" fill="#D9C7AC"/>
  </g>

  <rect width="1080" height="1920" filter="url(#grain)"/>
</svg>
