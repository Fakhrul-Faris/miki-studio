  <script>
    (() => {

const tl = gsap.timeline({ paused: true });
CustomEase.create("io", "0.65,0,0.35,1");
CustomEase.create("fall", "0.55,0,1,0.45");
// critically damped spring (stiffness 170, damping 26, mass 1): arrives with weight, no bounce
const spring = (d = 0.8, w = 13.04) => { const e = 1 - (1 + w * d) * Math.exp(-w * d); return (p) => (1 - (1 + w * p * d) * Math.exp(-w * p * d)) / e; };
// organic camera: each layer drifts on two offset sines (7.3 s, 11.9 s); k = depth (0 far .. 1 near)
function drift(layers, dur, t0) {
  const o = { t: 0 }, P = Math.PI * 2;
  layers.forEach(([sel]) => gsap.set(sel, { transformOrigin: "50% 50%" }));
  tl.fromTo(o, { t: 0 }, { t: dur, duration: dur, ease: "none", onUpdate() {
    const s = o.t + t0;
    layers.forEach(([sel, k]) => gsap.set(sel, {
      x: k * (8 * Math.sin(P * s / 7.3) + 6 * Math.sin(P * s / 11.9 + 1.3)),
      y: k * (6 * Math.cos(P * s / 7.3 + 0.7) + 5 * Math.sin(P * s / 11.9)),
      rotation: k * 0.4 * Math.sin(P * s / 11.9 + 0.4) }));
  } }, 0);
}
// iris: opens to the Ring first (the contents swap inside it), then to the whole frame
function iris(sel, cx, cy, r) {
  tl.fromTo(sel, { clipPath: `circle(0px at ${cx}px ${cy}px)` }, { clipPath: `circle(${r}px at ${cx}px ${cy}px)`, duration: 0.35, ease: "io" }, 0)
    .fromTo(sel, { clipPath: `circle(${r}px at ${cx}px ${cy}px)` }, { clipPath: `circle(2300px at ${cx}px ${cy}px)`, duration: 0.5, ease: "io", immediateRender: false }, 0.45);
}
// kinetic type: a word rises out of its mask, tracking tightens +4% -> 0
function rise(sel, at, stagger = 0.1) {
  tl.fromTo(sel, { yPercent: 115, scaleX: 1.04 }, { yPercent: 0, scaleX: 1, duration: 0.5, ease: "io", stagger }, at);
}
function sink(sel, at, stagger = 0.06) {
  tl.fromTo(sel, { yPercent: 0 }, { yPercent: -115, duration: 0.45, ease: "io", stagger, immediateRender: false }, at);
}
// a key number counts, then settles 1.08 -> 1.00
function count(sel, a, b, at, d = 0.6, pre = "RM") {
  const o = { v: a }, el = document.querySelector(sel);
  tl.fromTo(o, { v: a }, { v: b, duration: d, ease: "io", immediateRender: false, onUpdate() { el.textContent = pre + Math.round(o.v); } }, at);
  tl.fromTo(sel, { scale: 1.08 }, { scale: 1, duration: 0.5, ease: "io", immediateRender: false }, at + d - 0.1);
}

      const T0 = 21.95;
      gsap.set("#s3-w .w", { yPercent: 115 });
      gsap.set("#s3-w .stripe", { scaleX: 0 });
      // headline swap: coloured stripes sweep in from the left over the old lines, the lines change under them,
      // and the stripes leave to the right revealing the new first line
      function wipe(at, outSel, inSel, key) {
        const st = gsap.utils.toArray("#s3-w .st-" + key);
        tl.fromTo(st, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.26, ease: "power2.in", stagger: 0.05 }, at);
        tl.set(outSel, { yPercent: 115 }, at + 0.37);
        if (inSel) tl.set(inSel, { yPercent: 0, scaleX: 1 }, at + 0.37);
        tl.fromTo(st, { scaleX: 1, transformOrigin: "100% 50%" }, { scaleX: 0, duration: 0.34, ease: "power2.out", stagger: 0.05, immediateRender: false }, at + 0.37);
      }

tl.fromTo("#s3-grid line", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "io" }, 0.05);
// the floor we tilted onto becomes a city seen from above: the blocks rise into place, the camera pulls back
// HAND-OFF 2 (arrival) · the city is dropped onto the water from above, row by row: each block starts closer to the
// camera (bigger, transparent) and lands — top-down "falling" reads as shrinking onto the ground
tl.fromTo("#s3-lots > *", { opacity: 0, scale: 1.45, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.42, ease: "power2.in", stagger: { each: 0.011, from: "start" } }, 0.05);
tl.fromTo("#s3-lots > *", { scale: 1 }, { scale: 0.94, duration: 0.07, ease: "power1.out", yoyo: true, repeat: 1, stagger: { each: 0.011, from: "start" }, immediateRender: false }, 0.47);
gsap.set("#s3-cam", { svgOrigin: "540 900" });
tl.fromTo("#s3-cam", { scale: 1.3 }, { scale: 1, duration: 4.2, ease: "io" }, 0);
drift([["#s3-lots", 0.4]], 8.0, T0);
tl.fromTo("#s3-listing", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.7, ease: spring(0.7) }, 0.25);
tl.fromTo("#s3-buyers > g", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "io", stagger: 0.1 }, 0.4);
// the listing's route heads for the buyers...
tl.fromTo("#s3-route, #s3-route-bg", { strokeDasharray: 1300, strokeDashoffset: 1300 }, { strokeDashoffset: 0, duration: 1.6, ease: "io" }, 0.45);
// ...and the law drops the gate across it
gsap.set("#s3-bar", { svgOrigin: "450 1000", rotation: 90 });
tl.fromTo("#s3-gate", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.75);
tl.fromTo("#s3-sign", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.0);
tl.fromTo("#s3-bar", { rotation: 90 }, { rotation: 0, duration: 0.35, ease: "power3.in" }, 0.8150000000000001);
tl.fromTo("#s3-cam", { x: 0 }, { x: 10, duration: 0.06, ease: "none", yoyo: true, repeat: 3, immediateRender: false }, 1.165);
tl.fromTo("#s3-dead", { opacity: 0 }, { opacity: 0.9, duration: 0.4, ease: "io" }, 1.215);
tl.fromTo("#s3-sign", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.7, ease: spring(0.7) }, 2.005);
rise("#s3-w .a1", 0.11500000000000002, 0.1);
rise("#s3-w .a2", 1.065, 0.15);
rise("#s3-w .a3", 2.205, 0.15);
wipe(3.6650000000000005, "#s3-w .a1, #s3-w .a2, #s3-w .a3", "#s3-w .b1", "ab");
rise("#s3-w .b2", 4.585, 0.15);
// Shopee pulls the listing
tl.fromTo("#s3-susp", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "io" }, 4.685);
tl.fromTo("#s3-susp rect:nth-of-type(2), #s3-susp text", { scale: 1.3, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: spring(0.6) }, 4.685);
tl.fromTo("#s3-route, #s3-route-bg", { opacity: 1 }, { opacity: 0.35, duration: 0.6, ease: "io", immediateRender: false }, 4.985);
sink("#s3-w .b1, #s3-w .b2", 6.628, 0.03);

      window.__timelines["s3"] = tl;
