<!doctype html>
<!--
  EX36 look stills (art-direction.md v2): one Three.js scene per shot, real scale (1 unit = 1 m), Style B two-tone toon,
  no outlines, grain, words and the logo on objects, one accent (Daiso #E4007F) on the tag only.
  ?shot=L01|L05|L06  &grey=1 (blockout: no textures, flat grey)  &caps=0 (no caption sample)
  window.__info = the readability check for the key prop (craft §7 / §17): its screen box, area share, caption-band overlap.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #D5DDD3; }
  #c { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .bub { position: absolute; font-family: "Inter Display"; font-weight: 700; font-size: 40px; color: #1C1C21; background: #F2EEE6;
         padding: 12px 24px 14px; border-radius: 10px; white-space: nowrap; transform: translate(-50%, -100%); }
  .bub::after { content: ""; position: absolute; left: 36px; bottom: -18px; border: 10px solid transparent; border-top: 12px solid #F2EEE6; border-left: 10px solid #F2EEE6; }
  #grain { position: absolute; inset: 0; width: 1080px; height: 1920px; mix-blend-mode: overlay; opacity: .5; }
  .cap { position: absolute; left: 0; width: 1080px; text-align: center; }
  .cap span { display: inline-block; max-width: 640px; font-family: "Inter Display"; font-weight: 500; font-size: 36px; line-height: 48px;
              color: #EDE7DC; background: rgba(14,14,16,0.82); border-radius: 14px; padding: 12px 22px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"></div>
<svg id="grain" viewBox="0 0 1080 1920"><filter id="gf"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="36"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1920" filter="url(#gf)" opacity=".24"/></svg>
<script type="module">
import * as THREE from "./vendor/three.module.js";
const Q = new URLSearchParams(location.search);
const SHOT = Q.get("shot") || "L01", GREY = Q.get("grey") === "1", CAPS = Q.get("caps") !== "0";
const P2 = Math.PI * 2;
let seed = 36; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const pick = (a) => a[Math.floor(rnd() * a.length)];

// ---------- palette (art-direction.md v2): ground / shadow pairs, paper, kraft, one accent
const C = {
  ground: "#D5DDD3", shadow: "#2E4A4E", paper: "#F2EEE6", ink: "#1C1C21", kraft: "#C9A57A", tape: "#B48E61",
  accent: "#E4007F", steel: "#7E8E8C", steelDark: "#4E5E5D", rail: "#F4F1EA",
  goods: ["#ECE6DA", "#CFC6B4", "#B8C4BC", "#9FB0AA", "#E2D8C3", "#C7CFC8", "#8E9C98", "#F4F0E8", "#D9C2AE", "#A9B6C2"],
};

// ---------- renderer, two-tone toon (EX33 baseline)
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true, logarithmicDepthBuffer: SHOT === "L05" });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
const ramp = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255, ...Array(7).fill([255, 255, 255, 255]).flat()]), 8, 1, THREE.RGBAFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const greyM = new THREE.MeshToonMaterial({ color: "#BDBDBD", gradientMap: ramp });
const toon = (color, extra = {}) => (GREY ? greyM : new THREE.MeshToonMaterial({ color, gradientMap: ramp, ...extra }));
const toonMap = (map, extra = {}) => (GREY ? greyM : new THREE.MeshToonMaterial({ map, gradientMap: ramp, ...extra }));
const basic = (color, extra = {}) => (GREY ? new THREE.MeshBasicMaterial({ color: "#E0E0E0" }) : new THREE.MeshBasicMaterial({ color, toneMapped: false, ...extra }));
const shadowy = (o) => { o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };

// ---------- fonts, logo, canvas textures
const img = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
for (const [wt, n] of [[500, "Medium"], [700, "Bold"], [900, "Black"]]) document.fonts.add(await new FontFace("Inter Display", `url(../hf/assets/fonts/InterDisplay-${n}.ttf)`, { weight: String(wt) }).load());
const LOGO = await img("../hf/assets/logos/daiso.svg");
const canvasTex = (w, h, draw) => { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); draw(g, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t; };
const fit = (g, im, x, y, w, h) => { const s = Math.min(w / im.width, h / im.height); const dw = im.width * s, dh = im.height * s; g.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); };
const logoWhite = (g, x, y, w, h) => { const c = document.createElement("canvas"); c.width = Math.ceil(w); c.height = Math.ceil(h); const q = c.getContext("2d"); fit(q, LOGO, 0, 0, w, h); q.globalCompositeOperation = "source-in"; q.fillStyle = "#FFFFFF"; q.fillRect(0, 0, w, h); g.drawImage(c, x, y); };

// the swing tag's face (B-type-004: a huge number, small technical labels, one accent bar) — card 1100 x 1700 px
function tagFace(price = "RM5.90", sub = "EVERY ITEM", foot = "SINCE SEP 2018") {
  return canvasTex(1100, 1700, (g, w, h) => {
    g.fillStyle = C.paper; g.fillRect(0, 0, w, h);
    g.fillStyle = "rgba(28,28,33,0.10)"; g.fillRect(70, 330, w - 140, 3);
    fit(g, LOGO, 90, 375, 620, 120);
    g.fillStyle = C.ink; g.font = '700 54px "Inter Display"'; g.textAlign = "right"; g.fillText("PRICE", w - 80, 455);
    g.font = '900 360px "Inter Display"'; g.textAlign = "center"; g.letterSpacing = "-12px"; g.fillText(price, w / 2 + 6, 900);
    g.letterSpacing = "0px";
    g.fillStyle = C.accent; g.fillRect(80, 1010, w - 160, 70);
    g.fillStyle = C.ink; g.font = '700 58px "Inter Display"'; g.textAlign = "left"; g.fillText(sub, 80, 1190);
    g.font = '500 46px "Inter Display"'; g.fillStyle = "rgba(28,28,33,0.62)"; g.fillText(foot, 80, 1270);
    g.fillStyle = "rgba(28,28,33,0.10)"; g.fillRect(70, 1360, w - 140, 3);
    for (let i = 0; i < 38; i++) { const bw = 6 + (i * 7919) % 3 * 7; g.fillStyle = C.ink; g.fillRect(80 + i * 24, 1420, bw * 0.6, 150); }   // barcode
    g.font = '500 38px "Inter Display"'; g.fillStyle = "rgba(28,28,33,0.55)"; g.textAlign = "right"; g.fillText("4 549131 000590", w - 80, 1610);
  });
}
// tag outline (a swing tag: clipped top corners, punched hole) in metres; returns the Shape
function tagShape(w, h, holeR) {
  const c = w * 0.22, s = new THREE.Shape();
  s.moveTo(-w / 2, -h / 2); s.lineTo(w / 2, -h / 2); s.lineTo(w / 2, h / 2 - c); s.lineTo(w / 2 - c, h / 2); s.lineTo(-w / 2 + c, h / 2); s.lineTo(-w / 2, h / 2 - c); s.closePath();
  const hp = new THREE.Path(); hp.absarc(0, h / 2 - c * 0.85, holeR, 0, P2, true); s.holes.push(hp);
  return s;
}
// a swing tag: card (extruded, the face mapped onto its front), metal eyelet ring, a string loop up to `hang`
function swingTag(w, h, face) {
  const g = new THREE.Group();
  const geo = new THREE.ExtrudeGeometry(tagShape(w, h, w * 0.07), { depth: 0.0006, bevelEnabled: false, curveSegments: 24 });
  face.repeat.set(1 / w, 1 / h); face.offset.set(0.5, 0.5);
  const card = new THREE.Mesh(geo, [toonMap(face), toon(C.paper)]); g.add(card);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(w * 0.085, w * 0.018, 10, 40), toon("#B9BDBA")); ring.position.set(0, h / 2 - w * 0.22 * 0.85, 0.0004); g.add(ring);
  g.userData.eye = new THREE.Vector3(0, h / 2 - w * 0.22 * 0.85, 0);
  return shadowy(g);
}
const tube = (pts, r, color) => new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, r, 6, false), toon(color));

// ---------- readability check (craft §17): key prop's screen box
function screenBox(obj, cam) {
  const b = new THREE.Box3().setFromObject(obj), v = new THREE.Vector3(); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) {
    v.set(x, y, z).project(cam); const sx = (v.x * 0.5 + 0.5) * 1080, sy = (1 - (v.y * 0.5 + 0.5)) * 1920;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  }
  const cx0 = Math.max(0, x0), cx1 = Math.min(1080, x1), cy0 = Math.max(0, y0), cy1 = Math.min(1920, y1);
  const area = Math.max(0, cx1 - cx0) * Math.max(0, cy1 - cy0) / (1080 * 1920);
  return { box: [x0, y0, x1, y1].map(Math.round), area: +(area * 100).toFixed(2) + "%", inCaptionBand: y1 > 1340 && y0 < 1420, offscreen: area === 0 };
}
// aim the camera (yaw/pitch, no roll) so a world point lands on screen point (fx, fy) in 0..1
function aimAt(cam, P, fx, fy) {
  const e = new THREE.Euler(0, 0, 0, "YXZ"); e.setFromQuaternion(cam.quaternion);
  for (let i = 0; i < 80; i++) {
    cam.quaternion.setFromEuler(e); cam.updateMatrixWorld();
    const v = P.clone().project(cam), ex = (v.x * 0.5 + 0.5) - fx, ey = (1 - (v.y * 0.5 + 0.5)) - fy;
    if (Math.abs(ex) + Math.abs(ey) < 1e-4) break;
    e.y -= ex * 0.9; e.x -= ey * 0.9 * (cam.fov / 66);
  }
}
function bubble(text, world, cam, dx = 0, dy = -10) {
  const v = world.clone().project(cam), d = document.createElement("div");
  d.className = "bub"; d.textContent = text; d.style.left = `${(v.x * 0.5 + 0.5) * 1080 + dx}px`; d.style.top = `${(1 - (v.y * 0.5 + 0.5)) * 1920 + dy}px`;
  document.getElementById("ov").appendChild(d);
}
function caption(text) {
  if (!CAPS) return; const d = document.createElement("div"); d.className = "cap"; d.innerHTML = `<span>${text}</span>`;
  document.getElementById("ov").appendChild(d); d.style.top = `${1420 - d.offsetHeight}px`;
}

// =====================================================================================================
// L01 — one tag on the shadow edge of an aisle whose shelf lips recede like lanes (B-light-028 + B-type-004)
// =====================================================================================================
function L01() {
  scene.background = new THREE.Color(C.ground);
  const hemi = new THREE.HemisphereLight("#5F8A8E", "#5F8A8E", 1.0); scene.add(hemi);
  const key = new THREE.DirectionalLight("#FFFFFF", 2.6); key.castShadow = true; key.shadow.mapSize.set(4096, 4096);
  key.shadow.bias = -0.0003; key.shadow.normalBias = 0.01;
  key.position.set(-2.0, 4.2, 0.9); key.target.position.set(0.55, 0, -0.9); scene.add(key, key.target);
  const sc = key.shadow.camera; sc.left = -5; sc.right = 5; sc.top = 6; sc.bottom = -6; sc.near = 0.5; sc.far = 20; sc.updateProjectionMatrix();

  // floor: big pale tiles
  const tiles = canvasTex(1024, 1024, (g, w, h) => { g.fillStyle = C.ground; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(46,74,78,0.10)"; g.fillRect(0, 0, w, 6); g.fillRect(0, 0, 6, h); });
  tiles.wrapS = tiles.wrapT = THREE.RepeatWrapping; tiles.repeat.set(20, 40);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 24), toonMap(tiles)); floor.rotation.x = -Math.PI / 2; floor.position.z = -6; floor.receiveShadow = true; scene.add(floor);

  // gondola runs: back pegboard, kick plate, uprights, 5 shelves with label rails (the "lanes"), goods
  const peg = canvasTex(512, 512, (g, w, h) => { g.fillStyle = "#E7E3DA"; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(46,74,78,0.35)"; for (let y = 16; y < h; y += 32) for (let x = 16; x < w; x += 32) { g.beginPath(); g.arc(x, y, 4, 0, P2); g.fill(); } });
  peg.wrapS = peg.wrapT = THREE.RepeatWrapping;
  const labels = canvasTex(2048, 64, (g, w, h) => { g.fillStyle = C.rail; g.fillRect(0, 0, w, h); for (let x = 30; x < w; x += 170) { g.fillStyle = "rgba(28,28,33,0.16)"; g.fillRect(x, 14, 70, 36); g.fillStyle = "rgba(28,28,33,0.55)"; g.fillRect(x + 8, 22, 34, 6); } });
  labels.wrapS = THREE.RepeatWrapping;
  const LEVELS = [0.16, 0.5, 0.84, 1.18, 1.5];
  const goodsGeo = {
    pot: new THREE.LatheGeometry([[0, 0], [0.07, 0], [0.085, 0.11], [0.09, 0.115], [0.0, 0.115]].map(([x, y]) => new THREE.Vector2(x, y)), 24),
    mug: new THREE.CylinderGeometry(0.045, 0.042, 0.095, 20).translate(0, 0.0475, 0),
    box: new THREE.BoxGeometry(0.16, 0.12, 0.22).translate(0, 0.06, 0),
    lid: new THREE.BoxGeometry(0.165, 0.025, 0.225).translate(0, 0.12, 0),
    bottle: new THREE.LatheGeometry([[0, 0], [0.035, 0], [0.036, 0.16], [0.016, 0.2], [0.016, 0.23], [0, 0.23]].map(([x, y]) => new THREE.Vector2(x, y)), 18),
    bowl: new THREE.LatheGeometry([[0, 0], [0.04, 0], [0.075, 0.05], [0.074, 0.055], [0.0, 0.055]].map(([x, y]) => new THREE.Vector2(x, y)), 24),
    card: new THREE.BoxGeometry(0.012, 0.2, 0.11).translate(0, 0.1, 0),
    sponge: new THREE.BoxGeometry(0.09, 0.05, 0.13).translate(0, 0.025, 0),
  };
  const TYPES = Object.keys(goodsGeo).filter((k) => k !== "lid");
  const label = (bg) => canvasTex(256, 128, (g, w, h) => { g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(28,28,33,0.55)"; g.fillRect(24, 30, 120, 14); g.fillStyle = "rgba(28,28,33,0.28)"; for (let i = 0; i < 3; i++) g.fillRect(24, 58 + i * 16, 180 - i * 40, 7); g.fillStyle = "rgba(28,28,33,0.18)"; g.fillRect(170, 24, 60, 60); });
  const LABELS = C.goods.map((c) => label(c));
  const sleeve = new THREE.CylinderGeometry(0.0365, 0.0365, 0.08, 18, 1, true).translate(0, 0.08, 0);
  const boxFace = new THREE.PlaneGeometry(0.15, 0.1);
  const gondola = (x, face, z0, z1) => {   // face: +1 shelves open toward +x
    const len = z1 - z0, zc = (z0 + z1) / 2, g = new THREE.Group();
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.62, len), toonMap(peg.clone())); back.material.map && (back.material.map.repeat.set(len * 3, 5)); back.position.set(x - face * 0.42, 0.81, zc); g.add(back);
    const kick = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.12, len), toon(C.steelDark)); kick.position.set(x - face * 0.21, 0.06, zc); g.add(kick);
    for (let z = z0; z <= z1 + 1e-6; z += 1.0) { const up = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.66, 0.05), toon(C.steelDark)); up.position.set(x - face * 0.42, 0.83, z); g.add(up); }
    for (const y of LEVELS) {
      const sh = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.022, len), toon("#DCD6CB")); sh.position.set(x - face * 0.2, y, zc); g.add(sh);
      const lt = labels.clone(); lt.repeat.set(len / 1.2, 1); lt.needsUpdate = true;
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.04, len), [toonMap(lt), toonMap(lt), toon(C.rail), toon(C.rail), toon(C.rail), toon(C.rail)]);
      rail.position.set(x + face * 0.012, y - 0.004, zc); g.add(rail);
      if (y > 1.4) continue;
      // goods on this shelf: packed along z, seeded, a few gaps (an afternoon restock)
      for (let z = z0 + 0.12; z < z1 - 0.1;) {
        const ty = pick(TYPES), col = pick(C.goods);
        if (rnd() < 0.08) { z += 0.25; continue; }
        const rows = ty === "card" ? 3 : 2;
        for (let r = 0; r < rows; r++) {
          const m = new THREE.Mesh(goodsGeo[ty], toon(col)); m.position.set(x - face * (0.08 + r * 0.15), y + 0.011, z); m.rotation.y = ty === "card" ? 0 : rnd() * 0.3; g.add(m);
          if (ty === "box") { const l = new THREE.Mesh(goodsGeo.lid, toon(pick(C.goods))); l.position.copy(m.position); g.add(l); if (r === 0) { const f = new THREE.Mesh(boxFace, toonMap(pick(LABELS))); f.rotation.y = face * Math.PI / 2; f.position.set(m.position.x + face * 0.111, y + 0.07, z); g.add(f); } }
          if (ty === "bottle" || ty === "mug") { const sl = new THREE.Mesh(sleeve, toonMap(pick(LABELS))); sl.position.copy(m.position); if (ty === "mug") { sl.scale.set(1.25, 0.8, 1.25); sl.position.y -= 0.025; } g.add(sl); }
          if (ty === "mug") { const hd = new THREE.Mesh(new THREE.TorusGeometry(0.025, 0.006, 8, 16, Math.PI), toon(col)); hd.rotation.z = -Math.PI / 2; hd.position.set(m.position.x, y + 0.06, z - 0.045); hd.rotation.y = Math.PI / 2; g.add(hd); }
          if (ty === "card") { const pen = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.15, 8), toon(pick(["#2E4A4E", "#7E8E8C", "#C9A57A"]))); pen.position.set(m.position.x + face * 0.01, y + 0.1, z); g.add(pen); }
        }
        z += ty === "box" ? 0.24 : ty === "card" ? 0.13 : ty === "pot" ? 0.2 : 0.12;
      }
    }
    // pegboard section above the 4th shelf: hooks with blister packs
    for (let z = z0 + 0.15; z < z1 - 0.1; z += 0.16) for (const hy of [1.36]) {
      if (rnd() < 0.15) continue;
      const pk = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.17, 0.11), toonMap(pick(LABELS))); pk.position.set(x - face * 0.3, hy - 0.06, z); g.add(pk);
      const bl = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.09, 0.06), toon(pick(C.goods))); bl.position.set(x - face * 0.28, hy - 0.08, z); g.add(bl);
    }
    return shadowy(g);
  };
  scene.add(gondola(-0.7, 1, -4.0, 2.0), gondola(0.7, -1, -4.0, 2.0));
  // the next runs beyond the cross aisle, and the end-cap facing us with the DAISO header (the top of the lanes)
  const endcap = new THREE.Group();
  const ec = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.75, 0.9), toon("#E7E3DA")); ec.position.set(0, 0.375, -5.6); endcap.add(ec); endcap.position.x = 0.05; endcap.position.z = 1.2;
  for (const y of [0.75]) { const s = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.03, 0.42), toon("#DCD6CB")); s.position.set(0, y, -5.36); endcap.add(s);
    for (let x = -1.15; x < 1.2; x += 0.16) { const m = new THREE.Mesh(goodsGeo[pick(["bottle", "mug", "bowl"])], toon(pick(C.goods))); m.position.set(x, y + 0.015, -5.3); endcap.add(m); } }
  const header = canvasTex(1600, 300, (g, w, h) => { g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, w, h); fit(g, LOGO, 160, 50, w - 320, h - 100); });
  const hb = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.42, 0.05), [toon("#FFFFFF"), toon("#FFFFFF"), toon("#FFFFFF"), toon("#FFFFFF"), basic("#FFFFFF", { map: header }), toon("#FFFFFF")]);
  hb.position.set(0, 1.12, -5.95); endcap.add(hb);
  for (const sx of [-1.15, 1.15]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.4, 0.04), toon(C.steelDark)); p.position.set(sx, 0.95, -5.95); endcap.add(p); }
  scene.add(shadowy(endcap));
  scene.add(gondola(-1.9, 1, -12, -6.4), gondola(1.9, -1, -12, -6.4));

  // the hero: a hook peg out of the right run's pegboard, the tag hanging from it
  const pegY = 1.38, pegZ = 0.66;
  const hook = tube([new THREE.Vector3(-1.1, pegY, pegZ), new THREE.Vector3(-0.62, pegY, pegZ), new THREE.Vector3(-0.42, pegY + 0.005, pegZ), new THREE.Vector3(-0.4, pegY + 0.035, pegZ)], 0.0035, "#9AA3A1");
  hook.castShadow = true; scene.add(hook);
  const TAGX = -0.52;
  const tag = swingTag(0.16, 0.25, tagFace());
  tag.position.set(TAGX, pegY - 0.165, pegZ); tag.rotation.set(-0.28, 0.3, -0.05); scene.add(tag);
  tag.updateMatrixWorld();
  const eye = tag.localToWorld(tag.userData.eye.clone());
  const str = tube([eye, eye.clone().add(new THREE.Vector3(0.0, 0.03, 0.004)), new THREE.Vector3(TAGX - 0.005, pegY + 0.004, pegZ), eye.clone().add(new THREE.Vector3(0.012, 0.015, -0.006)), eye], 0.0011, "#EDE8DF");
  scene.add(str);
  // frame 0: goods mid-slide on the lane under the tag (they flow toward us along the 4th lane)
  for (const [ty, z] of [["pot", -0.55], ["card", -1.05], ["bottle", -1.5], ["box", -2.1]]) {
    const m = new THREE.Mesh(goodsGeo[ty], toon(pick(C.goods))); m.position.set(-0.62, 1.18 + 0.011, z); m.castShadow = true; m.receiveShadow = true; scene.add(m);
  }
